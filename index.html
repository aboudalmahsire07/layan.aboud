<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقديم شكوى</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #f8bbd0;
            border-radius: 12px;
            resize: none;
            font-family: inherit;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #f06292;
        }
        button {
            background-color: #f06292;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        button:hover {
            background-color: #e91e63;
            transform: scale(1.05);
        }
        #responseMessage {
            display: none;
            color: #d81b60;
            font-weight: bold;
            font-size: 24px;
            padding: 20px;
            line-height: 1.5;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="formSection">
            <h2>لتقديم الشكاوي لانحراف عبود<br>الرجاء كتابة المشكلة هون:</h2>
            <textarea id="complaintBox" rows="5" placeholder="اكتبي مشكلتك هون..."></textarea>
            <br>
            <button onclick="submitComplaint()">ارسال الشكوه</button>
        </div>
        <div id="responseMessage">
            يا ليان انتي حلوه<br>عبود ما عليه حق خبي جمالك ✨
        </div>
    </div>
    <script>
        function submitComplaint() {
            var text = document.getElementById('complaintBox').value;
            if(text.trim() === "") {
                alert("اكتبي الشكوى أولاً!");
                return;
            }
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('responseMessage').style.display = 'block';
        }
    </script>
</body>
</html>
